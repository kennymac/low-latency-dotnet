---
layout: default
---

<div class="page-container my-5">
  {% if page.title %}
  <header class="page-header mb-4">
    <h1 class="page-title fw-bold">{{ page.title }}</h1>
    {% if page.description %}
    <p class="lead text-muted">{{ page.description }}</p>
    {% endif %}
  </header>
  {% endif %}

  <div class="page-content">
    {{ content }}
  </div>
</div>
